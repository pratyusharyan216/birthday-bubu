<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1791598179" />
</head>
<body>
  <!-- Floating hearts background -->
  <div class="hearts" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Envelope intro -->
  <div id="intro" class="intro">
    <div class="intro-title">
      <span class="for" id="introLine"></span>
      <span class="intro-name" id="introName"></span>
    </div>
    <button class="envelope" id="openBtn" aria-label="Open your surprise">
      <span class="env-back"></span>
      <span class="env-letter"><span class="env-heart">♥</span></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="seal">💌</span>
    </button>
    <p class="intro-hint">tap to open</p>
  </div>

  <main id="site" class="site" hidden>
    <!-- Page 1: Hero -->
    <section class="page">
      <div class="hero">
        <p class="eyebrow reveal">today is all about you</p>
        <h1 class="reveal">Happy Birthday,<br /><em data-name></em></h1>
        <p class="tagline reveal" id="tagline"></p>
        <div class="countdown reveal" id="countdown" hidden>
          <div class="cd-units" id="cdUnits">
            <div><span id="cdD">0</span><small>days</small></div>
            <div><span id="cdH">0</span><small>hours</small></div>
            <div><span id="cdM">0</span><small>mins</small></div>
            <div><span id="cdS">0</span><small>secs</small></div>
          </div>
          <p class="cd-label" id="cdLabel"></p>
        </div>
      </div>
    </section>

    <!-- Name page -->
    <section class="page name-page">
      <div class="name-stage">
        <div class="name-sparkles" id="nameSparkles" aria-hidden="true"></div>
        <p class="name-line reveal" id="nameLine"></p>
        <h2 class="name-word" id="nameWord"></h2>
        <svg class="name-flourish" viewBox="0 0 400 40" aria-hidden="true">
          <path d="M10 22 C 80 2, 140 38, 200 20 S 320 2, 390 22" />
          <path class="heart-dot" d="M200 30 c-4 -4 -8 -6 -8 -10 a4 4 0 0 1 8 -1 a4 4 0 0 1 8 1 c0 4 -4 6 -8 10z" />
        </svg>
        <ul class="acrostic" id="acrostic"></ul>
      </div>
    </section>

    <!-- Page 2: Notes -->
    <section class="page" data-song="notes">
      <div class="section">
        <h2 class="reveal" id="notesTitle"></h2>
        <p class="section-sub reveal" id="notesSub"></p>
        <div class="notes" id="notesGrid"></div>
      </div>
    </section>

    <!-- Page 3: Gallery -->
    <section class="page" data-song="photos">
      <div class="section">
        <h2 class="reveal" id="photosTitle"></h2>
        <p class="section-sub reveal" id="photosSub"></p>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <!-- Page 4: Timeline -->
    <section class="page">
      <div class="section">
        <h2 class="reveal">Our memories</h2>
        <p class="section-sub reveal">A few of my favourite chapters</p>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- Page 5: Letter -->
    <section class="page">
      <div class="section">
        <article class="letter reveal" id="letter">
          <div id="letterBody"></div>
          <p class="signoff">Forever yours,<br /><span id="fromName"></span></p>
        </article>
      </div>
    </section>

    <!-- Page 6: Cake -->
    <section class="page">
      <div class="section cake-section">
        <h2 class="reveal">Make a wish</h2>
        <p class="section-sub reveal" id="cakeHint">Close your eyes, make a wish, then tap the candles</p>
        <button class="cake reveal" id="cake" aria-label="Blow out the candles">
          <span class="candles">
            <span class="candle"><span class="flame"></span></span>
            <span class="candle"><span class="flame"></span></span>
            <span class="candle"><span class="flame"></span></span>
          </span>
          <span class="tier tier-top"></span>
          <span class="tier tier-bottom"></span>
          <span class="plate"></span>
        </button>
        <p class="wish-msg" id="wishMsg" hidden></p>
        <button class="wish-replay" id="wishReplay" hidden>▶ Watch your surprise again</button>
        <footer class="footer reveal">made with all my love, just for <span data-name></span> 💖</footer>
      </div>
    </section>
  </main>

  <!-- Page navigation -->
  <nav class="pager" id="pager" hidden>
    <button class="pg-back" id="prevBtn" aria-label="Previous page">‹</button>
    <div class="dots" id="dots"></div>
    <button class="pg-next" id="nextBtn"><span id="nextLabel">Next</span> <span class="pg-heart">♥</span></button>
  </nav>

  <!-- Music player -->
  <div class="player" id="player" hidden>
    <button class="vinyl" id="playBtn" aria-label="Play / pause music">
      <span class="vinyl-icon" id="playIcon">❚❚</span>
    </button>
    <div class="track">
      <span class="track-title" id="trackTitle"></span>
      <span class="track-artist" id="trackArtist"></span>
    </div>
  </div>
  <audio id="audio" loop preload="auto"></audio>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
    <figure>
      <img id="lbImg" alt="" />
      <video id="lbVid" controls playsinline hidden></video>
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  </div>

  <!-- Video after the candles -->
  <div class="lightbox" id="wishBox" hidden>
    <button class="lb-close" id="wishClose" aria-label="Close">×</button>
    <video id="wishVideo" controls playsinline preload="metadata"></video>
  </div>

  <script src="content.js?v=1791598179"></script>
  <script src="script.js?v=1791598179"></script>
</body>
</html>
