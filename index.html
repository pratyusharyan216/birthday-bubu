<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Parisienne&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1791648368" />
</head>
<body>
  <!-- Floating hearts background -->
  <div class="hearts" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Envelope intro -->
  <div id="intro" class="intro">
    <div class="intro-title">
      <span class="for" id="introLine"></span>
      <span class="intro-name" id="introName"></span>
    </div>
    <div class="intro-stage" id="openBtn" role="button" tabindex="0" aria-label="Open your surprise">
      <svg class="intro-scene" viewBox="62 74 288 190" aria-hidden="true">
        <!-- the boy -->
        <g class="sc-boy">
          <ellipse cx="110" cy="253" rx="30" ry="5" fill="#1f55b5" opacity="0.12" />
          <g class="boy-hop">
            <g class="boy-stand" stroke="#1d3461" stroke-width="11" stroke-linecap="round" fill="none">
              <path d="M103 198 L101 244" /><path d="M117 198 L119 244" />
              <ellipse cx="105" cy="248" rx="9" ry="5" fill="#16233b" stroke="none" /><ellipse cx="123" cy="248" rx="9" ry="5" fill="#16233b" stroke="none" />
            </g>
            <g class="boy-kneel" stroke="#1d3461" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M104 220 L104 244 L80 246" /><path d="M116 220 L141 222 L141 243" />
              <ellipse cx="145" cy="248" rx="9" ry="5" fill="#16233b" stroke="none" /><ellipse cx="76" cy="246" rx="5" ry="7" fill="#16233b" stroke="none" />
            </g>
            <g class="boy-body">
              <rect x="94" y="142" width="32" height="64" rx="14" fill="#2f6bd0" />
              <g transform="translate(110 119.5) scale(-0.93 0.93)">
                <path d="M-3 14 L-2.5 27 Q2 29 6.5 27 L8 14 C11 10 12.5 4 12.5 -4 L2 4 Z" fill="#eab995" />
                <path d="M-8 -23 C-16 -20 -20 -13 -19 -6 C-19 -3 -22 0 -24 3.5 C-24.3 5.2 -21.5 5.6 -19.8 6 C-21 8 -20.6 9.4 -19.2 10.4 C-20.6 12 -20 13.6 -18.6 14.6 C-18.4 18.2 -16 20.6 -12.6 20.4 C-7 20 -1 15 4 8.5 C8 7 11 2 12 -5 L13 -20 C7 -26 -2 -26 -8 -23 Z" fill="#f6cfae" />
                <ellipse cx="-11" cy="6.5" rx="4" ry="2.8" fill="#ee8f8f" opacity="0.45" class="" />
                <path d="M-19.2 10.4 q3.2 1.6 5.4 -0.8" stroke="#b5533f" stroke-width="1.5" fill="none" stroke-linecap="round" />
                <path d="M-18 -9.5 q5 -3 10 -1" stroke="#2b1b17" stroke-width="1.8" fill="none" stroke-linecap="round" />
                <ellipse cx="-13.5" cy="-3" rx="1.9" ry="2.5" fill="#16233b" />
                <ellipse cx="6" cy="2" rx="3.6" ry="5" fill="#eab995" />
                <path d="M-10 -21 C-18 -25 -17 -35 -5 -34 C9 -36 22 -29 23 -14 C24 -5 21 3 16 10 C15 3 13 -3 9 -6 C6 -10 2 -13 -4 -15 C-7 -17 -9 -19 -10 -21 Z" fill="#2b1b17" />
                <path d="M-9 -24 C-4 -29 6 -30 14 -26" stroke="#4a2f26" stroke-width="1.6" fill="none" stroke-linecap="round" />
              </g>
              <g class="boy-arm">
                <path d="M112 156 L146 172" stroke="#f6cfae" stroke-width="9" stroke-linecap="round" />
                <path d="M112 156 L126 163" stroke="#2f6bd0" stroke-width="11" stroke-linecap="round" />
                <g class="sc-env sc-env-a" transform="translate(148 166)">
                  <rect x="-15" y="-10" width="30" height="20" rx="3" fill="#fff" stroke="#4a8fe7" stroke-width="1.6" />
                  <path d="M-15 -9 L0 3 L15 -9" fill="none" stroke="#4a8fe7" stroke-width="1.6" stroke-linejoin="round" />
                  <path d="M0 7 c-2.6 -2.6 -5 -3.8 -5 -6.2 a2.5 2.5 0 0 1 5 -0.8 a2.5 2.5 0 0 1 5 0.8 c0 2.4 -2.4 3.6 -5 6.2z" fill="#1f55b5" />
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- the girl -->
        <g class="sc-girl">
          <ellipse cx="300" cy="253" rx="30" ry="5" fill="#1f55b5" opacity="0.12" />
          <g class="girl-joy">
            <path d="M292 222 L292 244 M308 222 L308 244" stroke="#f6cfae" stroke-width="8" stroke-linecap="round" />
            <ellipse cx="289" cy="248" rx="8" ry="4.5" fill="#1f55b5" /><ellipse cx="305" cy="248" rx="8" ry="4.5" fill="#1f55b5" />
            
            <path d="M284 144 Q300 138 316 144 L331 224 Q300 235 269 224 Z" fill="#fff" stroke="#c3dafc" stroke-width="1.5" />
            <path d="M278 180 Q300 187 322 180" stroke="#4a8fe7" stroke-width="5" fill="none" stroke-linecap="round" />
            <g transform="translate(300 119.5) scale(0.93)">
              <path d="M-3 14 L-2.5 27 Q2 29 6.5 27 L8 14 C11 10 12.5 4 12.5 -4 L2 4 Z" fill="#eab995" />
                <path d="M-8 -23 C-16 -20 -20 -13 -19 -6 C-19 -3 -22 0 -24 3.5 C-24.3 5.2 -21.5 5.6 -19.8 6 C-21 8 -20.6 9.4 -19.2 10.4 C-20.6 12 -20 13.6 -18.6 14.6 C-18.4 18.2 -16 20.6 -12.6 20.4 C-7 20 -1 15 4 8.5 C8 7 11 2 12 -5 L13 -20 C7 -26 -2 -26 -8 -23 Z" fill="#f6cfae" />
                <ellipse cx="-11" cy="6.5" rx="4" ry="2.8" fill="#ee8f8f" opacity="0.45" class="girl-blush" />
                <path d="M-19.2 10.4 q3.2 1.6 5.4 -0.8" stroke="#b5533f" stroke-width="1.5" fill="none" stroke-linecap="round" />
              <path d="M-18 -9.5 q5 -3 10 -1.5" stroke="#2b1b17" stroke-width="1.5" fill="none" stroke-linecap="round" />
              <g class="girl-eye">
                <ellipse cx="-13.5" cy="-3" rx="1.9" ry="2.6" fill="#16233b" />
                <path d="M-16.5 -5.5 l-2.5 -1.5 M-15 -6.5 l-1.5 -2" stroke="#16233b" stroke-width="1" stroke-linecap="round" />
              </g>
              <path class="girl-eye-happy" d="M-17 -3 q3.5 3.5 7.5 0 M-17 -3 l-2 -1.5 M-15.5 -1.5 l-1.5 -2" stroke="#16233b" stroke-width="1.5" fill="none" stroke-linecap="round" />
              <!-- long hair: over the crown and down her back -->
              <path d="M-11 -21 C-9 -33 14 -36 23 -21 C31 -7 27 12 31 30 C34 44 29 58 21 68 C17 62 11 64 6 58 C12 46 6 31 8 17 C9 6 6 -4 0 -10 C-4 -15 -8 -18 -11 -21 Z" fill="#2b1b17" />
              <path d="M-10 -22 C-3 -19 3 -9 2 5 C1.5 11 3 16 5 19 C8 8 9 -6 3 -16 C0 -20 -5 -22 -10 -22 Z" fill="#4a2f26" />
              <path d="M14 -6 C20 10 16 30 22 50" stroke="#4a2f26" stroke-width="1.6" fill="none" stroke-linecap="round" />
              <!-- little bow -->
              <path d="M17 -22 l7 -5 v10 z M17 -22 l-7 -5 v10 z" fill="#4a8fe7" /><circle cx="17" cy="-22" r="2.2" fill="#1f55b5" />
            </g>
            <g class="girl-arm">
              <path d="M292 156 L270 176" stroke="#f6cfae" stroke-width="8" stroke-linecap="round" />
              <g class="sc-env sc-env-b" transform="translate(260 176)">
                  <rect x="-15" y="-10" width="30" height="20" rx="3" fill="#fff" stroke="#4a8fe7" stroke-width="1.6" />
                  <path d="M-15 -9 L0 3 L15 -9" fill="none" stroke="#4a8fe7" stroke-width="1.6" stroke-linejoin="round" />
                  <path d="M0 7 c-2.6 -2.6 -5 -3.8 -5 -6.2 a2.5 2.5 0 0 1 5 -0.8 a2.5 2.5 0 0 1 5 0.8 c0 2.4 -2.4 3.6 -5 6.2z" fill="#1f55b5" />
                </g>
            </g>
          </g>
        </g>
      </svg>
      <div class="sc-hearts" aria-hidden="true"><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
      <div class="envelope">
        <span class="env-back"></span>
        <span class="env-letter"><span class="env-heart">♥</span></span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="seal">💙</span>
      </div>
    </div>
    <p class="intro-hint">tap to begin</p>
  </div>

  <main id="site" class="site" hidden>
    <!-- Page 1: Hero -->
    <section class="page">
      <div class="hero">
        <p class="eyebrow reveal">today is all about you</p>
        <h1 class="reveal">Happy Birthday,<br /><em data-name></em></h1>
        <p class="tagline reveal" id="tagline"></p>
        <div class="countdown reveal" id="countdown" hidden>
          <div class="cd-units" id="cdUnits">
            <div><span id="cdD">0</span><small>days</small></div>
            <div><span id="cdH">0</span><small>hours</small></div>
            <div><span id="cdM">0</span><small>mins</small></div>
            <div><span id="cdS">0</span><small>secs</small></div>
          </div>
          <p class="cd-label" id="cdLabel"></p>
        </div>
      </div>
    </section>

    <!-- Name page -->
    <section class="page name-page">
      <div class="name-stage">
        <div class="name-sparkles" id="nameSparkles" aria-hidden="true"></div>
        <p class="name-line reveal" id="nameLine"></p>
        <h2 class="name-word" id="nameWord"></h2>
        <svg class="name-flourish" viewBox="0 0 400 40" aria-hidden="true">
          <path d="M10 22 C 80 2, 140 38, 200 20 S 320 2, 390 22" />
          <path class="heart-dot" d="M200 30 c-4 -4 -8 -6 -8 -10 a4 4 0 0 1 8 -1 a4 4 0 0 1 8 1 c0 4 -4 6 -8 10z" />
        </svg>
        <ul class="acrostic" id="acrostic"></ul>
      </div>
    </section>

    <!-- Cupid page -->
    <section class="page cupid-page">
      <div class="section cupid-section">
        <h2 class="reveal" id="cupidTitle"></h2>
        <p class="section-sub reveal" id="cupidSub"></p>
        <div class="cupid-scene reveal" id="cupidScene" role="button" tabindex="0" aria-label="Shoot an arrow at the heart">
          <svg viewBox="0 0 420 250" aria-hidden="true">
            <defs>
              <linearGradient id="cupidHeartFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7db4f5" /><stop offset="1" stop-color="#1f55b5" />
              </linearGradient>
              <!-- rose seen from above, in the heart's colours -->
              <linearGradient id="rosePetal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#93c2f8" /><stop offset="1" stop-color="#1f55b5" />
              </linearGradient>
              <linearGradient id="rosePetalIn" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7db4f5" /><stop offset="1" stop-color="#2c68cc" />
              </linearGradient>
              <symbol id="roseTop" viewBox="-52 -52 104 104">
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(0) scale(1)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(72) scale(1)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(144) scale(1)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(216) scale(1)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(288) scale(1)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(36) scale(0.74)" fill="url(#rosePetalIn)" stroke="#1b4ea8" stroke-width="1.9" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(108) scale(0.74)" fill="url(#rosePetalIn)" stroke="#1b4ea8" stroke-width="1.9" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(180) scale(0.74)" fill="url(#rosePetalIn)" stroke="#1b4ea8" stroke-width="1.9" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(252) scale(0.74)" fill="url(#rosePetalIn)" stroke="#1b4ea8" stroke-width="1.9" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(324) scale(0.74)" fill="url(#rosePetalIn)" stroke="#1b4ea8" stroke-width="1.9" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(14) scale(0.5)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="2.8" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(104) scale(0.5)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="2.8" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(194) scale(0.5)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="2.8" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(284) scale(0.5)" fill="url(#rosePetal)" stroke="#1b4ea8" stroke-width="2.8" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(50) scale(0.3)" fill="url(#rosePetalIn)" stroke="#184596" stroke-width="4.7" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(170) scale(0.3)" fill="url(#rosePetalIn)" stroke="#184596" stroke-width="4.7" stroke-linejoin="round" />
                <path d="M0 -5 C-27 -16 -31 -45 0 -48 C31 -45 27 -16 0 -5Z" transform="rotate(290) scale(0.3)" fill="url(#rosePetalIn)" stroke="#184596" stroke-width="4.7" stroke-linejoin="round" />
                <path d="M-4 1 a4.5 4.5 0 1 1 5 4 a7 7 0 1 1 -8 -8" fill="none" stroke="#143b85" stroke-width="1.6" stroke-linecap="round" />
                <path d="M-30 -22 q4 -12 16 -17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.55" />
              </symbol>
            </defs>

            <!-- little clouds -->
            <g fill="#fff" opacity="0.9">
              <ellipse cx="70" cy="222" rx="58" ry="14" /><ellipse cx="102" cy="212" rx="30" ry="14" /><ellipse cx="48" cy="214" rx="24" ry="11" />
              <ellipse cx="345" cy="226" rx="50" ry="11" /><ellipse cx="322" cy="218" rx="22" ry="10" />
            </g>

            <!-- cupid -->
            <g class="cupid-boy">
              <!-- wings -->
              <ellipse cx="58" cy="122" rx="15" ry="30" fill="#fff" stroke="#c3dafc" stroke-width="2" transform="rotate(-38 58 122)" />
              <ellipse cx="66" cy="136" rx="11" ry="22" fill="#fff" stroke="#c3dafc" stroke-width="2" transform="rotate(-62 66 136)" />
              <!-- legs -->
              <path d="M86 176 q-6 16 -14 24" stroke="#f6cfae" stroke-width="11" stroke-linecap="round" fill="none" />
              <path d="M100 176 q6 14 2 28" stroke="#f6cfae" stroke-width="11" stroke-linecap="round" fill="none" />
              <!-- body + sash -->
              <rect x="74" y="122" width="38" height="60" rx="18" fill="#fff" stroke="#c3dafc" stroke-width="1.5" />
              <path d="M78 132 L109 172" stroke="#4a8fe7" stroke-width="7" stroke-linecap="round" />
              <!-- quiver strap heart -->
              <path d="M93 150 c-3 -3 -6 -4.5 -6 -7.5 a3 3 0 0 1 6 -1 a3 3 0 0 1 6 1 c0 3 -3 4.5 -6 7.500z" fill="#fff" />
              <!-- head -->
              <circle cx="96" cy="96" r="25" fill="#f6cfae" />
              <path d="M71 96 C66 66 98 58 122 84 C114 82 108 84 103 79 C96 88 82 86 71 96Z" fill="#5a3825" />
              <path d="M72 92 C70 104 72 110 76 114 C74 106 75 98 78 92Z" fill="#5a3825" />
              <circle cx="108" cy="97" r="2.8" fill="#16233b" />
              <path d="M90 98 q4 -3.5 8 0" stroke="#16233b" stroke-width="2" fill="none" stroke-linecap="round" />
              <path d="M99 108 q5 5 11 -1" stroke="#b5533f" stroke-width="2" fill="none" stroke-linecap="round" />
              <circle cx="112" cy="105" r="4.5" fill="#ee8f8f" opacity="0.35" />
              <circle cx="88" cy="106" r="4.5" fill="#ee8f8f" opacity="0.3" />
              <!-- arm holding the bow -->
              <path d="M104 140 L150 128" stroke="#f6cfae" stroke-width="9" stroke-linecap="round" />
            </g>

            <!-- bow -->
            <path d="M150 84 Q184 128 150 172" stroke="#a86b3c" stroke-width="4.5" fill="none" stroke-linecap="round" />
            <path id="cupidString" d="M150 84 L150 128 L150 172" stroke="#566a8a" stroke-width="1.5" fill="none" />

            <!-- arrow + the hand that pulls it -->
            <g class="cupid-arrow">
              <path d="M96 142 L150 128" stroke="#f6cfae" stroke-width="9" stroke-linecap="round" class="cupid-pull-arm" />
              <line x1="150" y1="128" x2="206" y2="128" stroke="#a86b3c" stroke-width="3" stroke-linecap="round" />
              <path d="M150 128 l-9 -6 M150 128 l-9 6 M156 128 l-9 -6 M156 128 l-9 6" stroke="#4a8fe7" stroke-width="2.5" stroke-linecap="round" />
              <path d="M219 128 L204 117 a5.5 5.5 0 1 0 0 11 a5.5 5.5 0 1 0 0 11 Z" fill="#4a8fe7" />
            </g>

            <!-- heart target -->
            <g class="cupid-float">
              <g class="cupid-heart" id="cupidHeart">
                <path d="M340 172 C310 150 290 132 290 109 C290 93 302 82 317 82 C327 82 335 88 340 96 C345 88 353 82 363 82 C378 82 390 93 390 109 C390 132 370 150 340 172 Z" fill="url(#cupidHeartFill)" />
                <path d="M304 106 q2 -12 14 -14" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
              </g>
            </g>
          </svg>
          <div class="cupid-burst" id="cupidBurst"></div>
        </div>
        <p class="cupid-line" id="cupidLine"></p>
        <div class="cupid-count" id="cupidCount" aria-hidden="true"></div>
        <button class="cupid-btn reveal" id="cupidBtn"></button>
      </div>
    </section>

    <!-- Page 2: Notes -->
    <section class="page" data-song="notes">
      <div class="section">
        <h2 class="reveal" id="notesTitle"></h2>
        <p class="section-sub reveal" id="notesSub"></p>
        <div class="notes" id="notesGrid"></div>
      </div>
    </section>

    <!-- Page 3: Gallery -->
    <section class="page" data-song="photos">
      <div class="section">
        <h2 class="reveal" id="photosTitle"></h2>
        <p class="section-sub reveal" id="photosSub"></p>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <!-- Page 4: Timeline -->
    <section class="page">
      <div class="section">
        <h2 class="reveal">Our memories</h2>
        <p class="section-sub reveal">A few of my favourite chapters</p>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- Page 5: Letter -->
    <section class="page">
      <div class="section">
        <article class="letter reveal" id="letter">
          <div id="letterBody"></div>
          <p class="signoff">Forever yours,<br /><span id="fromName"></span></p>
        </article>
      </div>
    </section>

    <!-- Page 6: Cake -->
    <section class="page">
      <div class="section cake-section">
        <h2 class="reveal">Make a wish</h2>
        <p class="section-sub reveal" id="cakeHint">Close your eyes, make a wish, then tap the candles</p>
        <button class="cake reveal" id="cake" aria-label="Blow out the candles">
          <span class="candles">
            <span class="candle"><span class="flame"></span></span>
            <span class="candle"><span class="flame"></span></span>
            <span class="candle"><span class="flame"></span></span>
          </span>
          <span class="tier tier-top"></span>
          <span class="tier tier-bottom"></span>
          <span class="plate"></span>
        </button>
        <p class="wish-msg" id="wishMsg" hidden></p>
        <button class="wish-replay" id="wishReplay" hidden>▶ Watch your surprise again</button>
        <footer class="footer reveal">made with all my love, just for <span data-name></span> 💙</footer>
      </div>
    </section>
  </main>

  <!-- Page navigation -->
  <nav class="pager" id="pager" hidden>
    <button class="pg-back" id="prevBtn" aria-label="Previous page">‹</button>
    <div class="dots" id="dots"></div>
    <button class="pg-next" id="nextBtn" aria-label="Next slide"><span class="pg-heart">♥</span></button>
  </nav>

  <!-- Music player -->
  <div class="player" id="player" hidden>
    <button class="balloons" id="playBtn" aria-label="Play / pause music">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g class="bl bl1">
          <g class="bl-body">
            <path d="M14 27.5 Q16.5 35.8 24 46" fill="none" stroke="#566a8a" stroke-width="0.8" stroke-linecap="round" />
