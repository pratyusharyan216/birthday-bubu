<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Great+Vibes&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1791599036" />
</head>
<body>
  <!-- Floating hearts background -->
  <div class="hearts" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Envelope intro -->
  <div id="intro" class="intro">
    <div class="intro-title">
      <span class="for" id="introLine"></span>
      <span class="intro-name" id="introName"></span>
    </div>
    <button class="envelope" id="openBtn" aria-label="Open your surprise">
      <span class="env-back"></span>
      <span class="env-letter"><span class="env-heart">♥</span></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="seal">💌</span>
    </button>
    <p class="intro-hint">tap to open</p>
  </div>

  <main id="site" class="site" hidden>
    <!-- Page 1: Hero -->
    <section class="page">
      <div class="hero">
        <p class="eyebrow reveal">today is all about you</p>
        <h1 class="reveal">Happy Birthday,<br /><em data-name></em></h1>
        <p class="tagline reveal" id="tagline"></p>
        <div class="countdown reveal" id="countdown" hidden>
          <div class="cd-units" id="cdUnits">
            <div><span id="cdD">0</span><small>days</small></div>
            <div><span id="cdH">0</span><small>hours</small></div>
            <div><span id="cdM">0</span><small>mins</small></div>
            <div><span id="cdS">0</span><small>secs</small></div>
          </div>
          <p class="cd-label" id="cdLabel"></p>
        </div>
      </div>
    </section>

    <!-- Name page -->
    <section class="page name-page">
      <div class="name-stage">
        <div class="name-sparkles" id="nameSparkles" aria-hidden="true"></div>
        <p class="name-line reveal" id="nameLine"></p>
        <h2 class="name-word" id="nameWord"></h2>
        <svg class="name-flourish" viewBox="0 0 400 40" aria-hidden="true">
          <path d="M10 22 C 80 2, 140 38, 200 20 S 320 2, 390 22" />
          <path class="heart-dot" d="M200 30 c-4 -4 -8 -6 -8 -10 a4 4 0 0 1 8 -1 a4 4 0 0 1 8 1 c0 4 -4 6 -8 10z" />
        </svg>
        <ul class="acrostic" id="acrostic"></ul>
      </div>
    </section>

    <!-- Cupid page -->
    <section class="page cupid-page">
      <div class="section cupid-section">
        <h2 class="reveal" id="cupidTitle"></h2>
        <p class="section-sub reveal" id="cupidSub"></p>
        <div class="cupid-scene reveal" id="cupidScene" role="button" tabindex="0" aria-label="Shoot an arrow at the heart">
          <svg viewBox="0 0 420 250" aria-hidden="true">
            <defs>
              <linearGradient id="cupidHeartFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f58ba3" /><stop offset="1" stop-color="#b8325a" />
              </linearGradient>
            </defs>

            <!-- little clouds -->
            <g fill="#fff" opacity="0.9">
              <ellipse cx="70" cy="222" rx="58" ry="14" /><ellipse cx="102" cy="212" rx="30" ry="14" /><ellipse cx="48" cy="214" rx="24" ry="11" />
              <ellipse cx="345" cy="226" rx="50" ry="11" /><ellipse cx="322" cy="218" rx="22" ry="10" />
            </g>

            <!-- cupid -->
            <g class="cupid-boy">
              <!-- wings -->
              <ellipse cx="58" cy="122" rx="15" ry="30" fill="#fff" stroke="#f7c6d0" stroke-width="2" transform="rotate(-38 58 122)" />
              <ellipse cx="66" cy="136" rx="11" ry="22" fill="#fff" stroke="#f7c6d0" stroke-width="2" transform="rotate(-62 66 136)" />
              <!-- legs -->
              <path d="M86 176 q-6 16 -14 24" stroke="#f6cfae" stroke-width="11" stroke-linecap="round" fill="none" />
              <path d="M100 176 q6 14 2 28" stroke="#f6cfae" stroke-width="11" stroke-linecap="round" fill="none" />
              <!-- body + sash -->
              <rect x="74" y="122" width="38" height="60" rx="18" fill="#fff" stroke="#f7c6d0" stroke-width="1.5" />
              <path d="M78 132 L109 172" stroke="#e05a7a" stroke-width="7" stroke-linecap="round" />
              <!-- quiver strap heart -->
              <path d="M93 150 c-3 -3 -6 -4.5 -6 -7.5 a3 3 0 0 1 6 -1 a3 3 0 0 1 6 1 c0 3 -3 4.5 -6 7.500z" fill="#fff" />
              <!-- head -->
              <circle cx="96" cy="96" r="25" fill="#f6cfae" />
              <path d="M71 96 C66 66 98 58 122 84 C114 82 108 84 103 79 C96 88 82 86 71 96Z" fill="#5a3825" />
              <path d="M72 92 C70 104 72 110 76 114 C74 106 75 98 78 92Z" fill="#5a3825" />
              <circle cx="108" cy="97" r="2.8" fill="#3b1f2b" />
              <path d="M90 98 q4 -3.5 8 0" stroke="#3b1f2b" stroke-width="2" fill="none" stroke-linecap="round" />
              <path d="M99 108 q5 5 11 -1" stroke="#b8325a" stroke-width="2" fill="none" stroke-linecap="round" />
              <circle cx="112" cy="105" r="4.5" fill="#e05a7a" opacity="0.35" />
              <circle cx="88" cy="106" r="4.5" fill="#e05a7a" opacity="0.3" />
              <!-- arm holding the bow -->
              <path d="M104 140 L150 128" stroke="#f6cfae" stroke-width="9" stroke-linecap="round" />
            </g>

            <!-- bow -->
            <path d="M150 84 Q184 128 150 172" stroke="#a86b3c" stroke-width="4.5" fill="none" stroke-linecap="round" />
            <path id="cupidString" d="M150 84 L150 128 L150 172" stroke="#7a5866" stroke-width="1.5" fill="none" />

            <!-- arrow + the hand that pulls it -->
            <g class="cupid-arrow">
              <path d="M96 142 L150 128" stroke="#f6cfae" stroke-width="9" stroke-linecap="round" class="cupid-pull-arm" />
              <line x1="150" y1="128" x2="206" y2="128" stroke="#a86b3c" stroke-width="3" stroke-linecap="round" />
              <path d="M150 128 l-9 -6 M150 128 l-9 6 M156 128 l-9 -6 M156 128 l-9 6" stroke="#e05a7a" stroke-width="2.5" stroke-linecap="round" />
              <path d="M219 128 L204 117 a5.5 5.5 0 1 0 0 11 a5.5 5.5 0 1 0 0 11 Z" fill="#e05a7a" />
            </g>

            <!-- heart target -->
            <g class="cupid-float">
              <g class="cupid-heart" id="cupidHeart">
                <path d="M340 172 C310 150 290 132 290 109 C290 93 302 82 317 82 C327 82 335 88 340 96 C345 88 353 82 363 82 C378 82 390 93 390 109 C390 132 370 150 340 172 Z" fill="url(#cupidHeartFill)" />
                <path d="M304 106 q2 -12 14 -14" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
              </g>
            </g>
          </svg>
          <div class="cupid-burst" id="cupidBurst"></div>
        </div>
        <p class="cupid-line" id="cupidLine"></p>
        <div class="cupid-count" id="cupidCount" aria-hidden="true"></div>
        <button class="cupid-btn reveal" id="cupidBtn">Shoot an arrow 🏹</button>
      </div>
    </section>

    <!-- Page 2: Notes -->
    <section class="page" data-song="notes">
      <div class="section">
        <h2 class="reveal" id="notesTitle"></h2>
        <p class="section-sub reveal" id="notesSub"></p>
        <div class="notes" id="notesGrid"></div>
      </div>
    </section>

    <!-- Page 3: Gallery -->
    <section class="page" data-song="photos">
      <div class="section">
        <h2 class="reveal" id="photosTitle"></h2>
        <p class="section-sub reveal" id="photosSub"></p>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <!-- Page 4: Timeline -->
    <section class="page">
      <div class="section">
        <h2 class="reveal">Our memories</h2>
        <p class="section-sub reveal">A few of my favourite chapters</p>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- Page 5: Letter -->
    <section class="page">
      <div class="section">
        <article class="letter reveal" id="letter">
          <div id="letterBody"></div>
          <p class="signoff">Forever yours,<br /><span id="fromName"></span></p>
        </article>
      </div>
    </section>

    <!-- Page 6: Cake -->
    <section class="page">
      <div class="section cake-section">
        <h2 class="reveal">Make a wish</h2>
        <p class="section-sub reveal" id="cakeHint">Close your eyes, make a wish, then tap the candles</p>
        <button class="cake reveal" id="cake" aria-label="Blow out the candles">
          <span class="candles">
            <span class="candle"><span class="flame"></span></span>
            <span class="candle"><span class="flame"></span></span>
            <span class="candle"><span class="flame"></span></span>
          </span>
          <span class="tier tier-top"></span>
          <span class="tier tier-bottom"></span>
          <span class="plate"></span>
        </button>
        <p class="wish-msg" id="wishMsg" hidden></p>
        <button class="wish-replay" id="wishReplay" hidden>▶ Watch your surprise again</button>
        <footer class="footer reveal">made with all my love, just for <span data-name></span> 💖</footer>
      </div>
    </section>
  </main>

  <!-- Page navigation -->
  <nav class="pager" id="pager" hidden>
    <button class="pg-back" id="prevBtn" aria-label="Previous page">‹</button>
    <div class="dots" id="dots"></div>
    <button class="pg-next" id="nextBtn" aria-label="Next slide"><span class="pg-heart">♥</span></button>
  </nav>

  <!-- Music player -->
  <div class="player" id="player" hidden>
    <button class="vinyl" id="playBtn" aria-label="Play / pause music">
      <span class="vinyl-icon" id="playIcon">❚❚</span>
    </button>
    <div class="track">
      <span class="track-title" id="trackTitle"></span>
      <span class="track-artist" id="trackArtist"></span>
    </div>
  </div>
  <audio id="audio" loop preload="auto"></audio>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
    <figure>
      <img id="lbImg" alt="" />
      <video id="lbVid" controls playsinline hidden></video>
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  </div>

  <!-- Video after the candles -->
  <div class="lightbox" id="wishBox" hidden>
    <button class="lb-close" id="wishClose" aria-label="Close">×</button>
    <video id="wishVideo" controls playsinline preload="metadata"></video>
  </div>

  <script src="content.js?v=1791599036"></script>
  <script src="script.js?v=1791599036"></script>
</body>
</html>
